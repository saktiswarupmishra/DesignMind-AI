version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_AI_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - designmind-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=mysql://root:@mysql:3306/designmind_ai
      - JWT_SECRET=designmind-super-secret-jwt-key-2026
      - JWT_REFRESH_SECRET=designmind-refresh-secret-key-2026
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mysql
      - redis
    networks:
      - designmind-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ENVIRONMENT=development
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5000
    networks:
      - designmind-network

  mysql:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=designmind_ai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - designmind-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - designmind-network

volumes:
  mysql-data:
  redis-data:

networks:
  designmind-network:
    driver: bridge
